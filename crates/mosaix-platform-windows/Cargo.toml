[package]
name = "mosaix-platform-windows"
description = "Windows platform adapter: Win32 window management, event hooks, and DPI handling."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mosaix-domain = { path = "../mosaix-domain" }
mosaix-platform-api = { path = "../mosaix-platform-api" }
tracing = { workspace = true }
anyhow = { workspace = true }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
]