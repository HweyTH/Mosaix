[package]
name = "mosaix-platform-macos"
description = "macOS platform adapter: Accessibility API, AppKit integration, and coordinate conversion."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mosaix-domain = { path = "../mosaix-domain" }
mosaix-platform-api = { path = "../mosaix-platform-api" }
anyhow = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
libc = "0.2"
cocoa-foundation = "0.2"
objc2 = "0.6"

[dev-dependencies]
libc = "0.2"
tracing-subscriber = { workspace = true }
mosaix-platform-api = { path = "../mosaix-platform-api" }
