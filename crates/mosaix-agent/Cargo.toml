[package]
name = "mosaix-agent"
description = "Mosaix background window management agent."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mosaix-agent"
path = "src/main.rs"

[dependencies]
mosaix-engine = { path = "../mosaix-engine" }
mosaix-config = { path = "../mosaix-config" }
mosaix-ipc = { path = "../mosaix-ipc" }
mosaix-persistence = { path = "../mosaix-persistence" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
mosaix-domain = { path = "../mosaix-domain" }
mosaix-layout = { path = "../mosaix-layout" }
mosaix-platform-windows = { path = "../mosaix-platform-windows" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.61"
features = ["Win32_UI_Input_KeyboardAndMouse"]

[target.'cfg(target_os = "macos")'.dependencies]
mosaix-domain = { path = "../mosaix-domain" }
mosaix-layout = { path = "../mosaix-layout" }
mosaix-platform-macos = { path = "../mosaix-platform-macos" }
mosaix-platform-api = { path = "../mosaix-platform-api" }
