[package]
name = "mosaix-agent"
description = "Mosaix background window management agent."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mosaix-agent"
path = "src/main.rs"

[dependencies]
mosaix-engine = { path = "../mosaix-engine" }
mosaix-config = { path = "../mosaix-config" }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
mosaix-platform-windows = { path = "../mosaix-platform-windows" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Win32_UI_Input_KeyboardAndMouse"]
