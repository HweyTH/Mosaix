name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build Windows release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build release binaries
        run: cargo build --release --package mosaix-agent --package mosaix-cli

      - name: Run tests
        run: cargo test --workspace

      - name: Prepare release archive
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dir = "mosaix-$tag-windows-x86_64"
          New-Item -ItemType Directory -Path $dir | Out-Null

          Copy-Item target/release/mosaix-agent.exe $dir/
          Copy-Item target/release/mosaix.exe $dir/
          Copy-Item LICENSE $dir/
          Copy-Item README.md $dir/

          Compress-Archive -Path $dir -DestinationPath "$dir.zip"
          echo "ASSET_NAME=$dir.zip" >> $env:GITHUB_ENV
          echo "ASSET_PATH=$dir.zip" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ env.ASSET_PATH }}
