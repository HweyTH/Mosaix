[workspace]
resolver = "2"

members = [
    "crates/mosaix-domain",
    "crates/mosaix-layout",
    "crates/mosaix-rules",
    "crates/mosaix-engine",
    "crates/mosaix-config",
    "crates/mosaix-ipc",
    "crates/mosaix-platform-api",
    "crates/mosaix-platform-windows",
    "crates/mosaix-platform-macos",
    "crates/mosaix-agent",
    "crates/mosaix-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/user/mosaix"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }