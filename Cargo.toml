[workspace]
resolver = "2"

members = [
    "apps/mosaix-settings/src-tauri",
    "crates/mosaix-domain",
    "crates/mosaix-layout",
    "crates/mosaix-rules",
    "crates/mosaix-engine",
    "crates/mosaix-config",
    "crates/mosaix-persistence",
    "crates/mosaix-ipc",
    "crates/mosaix-platform-api",
    "crates/mosaix-platform-windows",
    "crates/mosaix-platform-macos",
    "crates/mosaix-agent",
    "crates/mosaix-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/HweyTH/Mosaix"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
notify = "6"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio = { version = "1", features = ["full"] }
regex = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
